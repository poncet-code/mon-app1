<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <title>Scanner</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0a0a0a;
      color: #fff;
      font-family: monospace;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px;
    }

    h1 {
      font-size: 18px;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: #aaa;
      margin-bottom: 4px;
    }

    #scanner-container {
      width: 100%;
      max-width: 360px;
      border-radius: 12px;
      overflow: hidden;
      position: relative;
      background: #111;
      aspect-ratio: 4/3;
    }

    #scanner-container video {
      width: 100% !important;
      height: 100% !important;
      object-fit: cover;
      display: block;
    }

    #scan-guide {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 80%;
      height: 40%;
      border: 2px solid #00ff88;
      border-radius: 8px;
      box-shadow: 0 0 0 2000px rgba(0,0,0,0.45);
      pointer-events: none;
    }

    #btn {
      margin-top: 24px;
      width: 100%;
      max-width: 360px;
      padding: 16px;
      background: #00ff88;
      color: #000;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-family: monospace;
      font-weight: bold;
      letter-spacing: 2px;
      cursor: pointer;
    }

    #btn.stop {
      background: #ff4444;
      color: #fff;
    }

    #result-box {
      margin-top: 32px;
      width: 100%;
      max-width: 360px;
    }

    #result-box label {
      font-size: 11px;
      letter-spacing: 3px;
      color: #555;
      text-transform: uppercase;
      display: block;
      margin-bottom: 8px;
    }

    #code-display {
      background: #111;
      border: 1px solid #222;
      border-radius: 10px;
      padding: 16px;
      font-size: 22px;
      letter-spacing: 3px;
      color: #00ff88;
      min-height: 56px;
      word-break: break-all;
    }

    #note-box {
      margin-top: 16px;
      width: 100%;
      max-width: 360px;
    }

    #note-box label {
      font-size: 11px;
      letter-spacing: 3px;
      color: #555;
      text-transform: uppercase;
      display: block;
      margin-bottom: 8px;
    }

    #log {
      width: 100%;
      background: #111;
      border: 1px solid #222;
      border-radius: 10px;
      padding: 14px;
      color: #aaa;
      font-size: 12px;
      font-family: monospace;
      min-height: 120px;
      max-height: 200px;
      overflow-y: auto;
      word-break: break-all;
    }

    #log .entry { border-bottom: 1px solid #1a1a1a; padding: 4px 0; }
    #log .entry.ok { color: #00ff88; }
    #log .entry.err { color: #ff4444; }
    #log .entry.info { color: #aaa; }

    #status {
      margin-top: 12px;
      font-size: 12px;
      color: #444;
      letter-spacing: 1px;
      text-align: center;
    }
  </style>
</head>
<body>

  <h1>Scanner</h1>
  <div style="font-size:11px;letter-spacing:3px;color:#333;margin-bottom:24px;">V7</div>

  <div id="scanner-container">
    <div id="scan-guide"></div>
  </div>

  <button id="btn" onclick="toggleScanner()">SCANNER</button>

  <div id="result-box">
    <label>Code détecté</label>
    <div id="code-display">—</div>
  </div>

  <div id="note-box">
    <label>Logs</label>
    <div id="log"></div>
  </div>

  <div id="status">Appuie sur Scanner pour commencer</div>

  <script type="module">
    import { scanImageData } from 'https://cdn.jsdelivr.net/npm/@undecaf/zbar-wasm@0.10.1/dist/index.js';

    let scanning = false;
    let stream = null;
    let videoEl = null;
    let rafId = null;
    let canvas = null;
    let ctx = null;
    let frameCount = 0;

    function log(msg, type = 'info') {
      const el = document.getElementById('log');
      const line = document.createElement('div');
      line.className = 'entry ' + type;
      line.textContent = new Date().toLocaleTimeString() + ' — ' + msg;
      el.prepend(line);
    }

    log('zbar-wasm chargé', 'ok');

    window.toggleScanner = function() {
      if (!scanning) startScanner();
      else stopScanner();
    };

    async function startScanner() {
      scanning = true;
      frameCount = 0;
      document.getElementById('code-display').textContent = '—';
      document.getElementById('btn').textContent = 'ARRÊTER';
      document.getElementById('btn').classList.add('stop');
      document.getElementById('status').textContent = 'Caméra active...';

      videoEl = document.createElement('video');
      videoEl.setAttribute('playsinline', '');
      videoEl.setAttribute('autoplay', '');
      videoEl.muted = true;
      document.getElementById('scanner-container').prepend(videoEl);

      try {
        log('Demande accès caméra...');
        stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } }
        });
        videoEl.srcObject = stream;
        await videoEl.play();
        log('Vidéo active — ' + videoEl.videoWidth + 'x' + videoEl.videoHeight, 'ok');
      } catch (err) {
        log('Erreur caméra : ' + err.name + ' — ' + err.message, 'err');
        stopScanner();
        return;
      }

      canvas = document.createElement('canvas');
      ctx = canvas.getContext('2d');
      rafLoop();
    }

    async function rafLoop() {
      if (!scanning) return;

      if (videoEl.readyState < 2) {
        rafId = requestAnimationFrame(rafLoop);
        return;
      }

      canvas.width = videoEl.videoWidth;
      canvas.height = videoEl.videoHeight;
      ctx.drawImage(videoEl, 0, 0);

      try {
        const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const symbols = await scanImageData(imageData);
        if (symbols.length > 0) {
          const code = symbols[0].decode();
          log('Code trouvé : ' + code + ' (' + symbols[0].typeName + ')', 'ok');
          onDetected(code);
          return;
        }
      } catch (e) {
        log('Erreur scan : ' + e.message, 'err');
      }

      frameCount++;
      if (frameCount % 30 === 0) log('Frames : ' + frameCount);
      rafId = requestAnimationFrame(rafLoop);
    }

    function onDetected(code) {
      document.getElementById('code-display').textContent = code;
      document.getElementById('status').textContent = 'Code détecté ✓';
      stopScanner();
    }

    function stopScanner() {
      scanning = false;
      cancelAnimationFrame(rafId);
      if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
      if (videoEl) { videoEl.remove(); videoEl = null; }
      canvas = null; ctx = null;
      document.getElementById('btn').textContent = 'SCANNER';
      document.getElementById('btn').classList.remove('stop');
      const status = document.getElementById('status');
      if (status.textContent === 'Caméra active...') {
        status.textContent = 'Scan arrêté';
      }
      log('Scanner arrêté');
    }
  </script>
</body>
</html>
