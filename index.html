<!--
  ═══════════════════════════════════════════════════════════════
  SCANNER DE CODE-BARRES — Contexte pour Claude
  ═══════════════════════════════════════════════════════════════

  Auteur      : Lance (lachainedefrance@gmail.com)
  Hébergement : GitHub Pages (HTTPS automatique)
  Cible       : Chrome sur iOS (iPhone/iPad)
  État        : Fonctionne parfaitement (V9 · iOS compat)
                NE PAS RÉGRESSER cette base.

  Stratégie technique :
  ─────────────────────
  - API BarcodeDetector native quand dispo, sinon fallback
    polyfill ZXing chargé depuis CDN (esm.sh → jsdelivr →
    unpkg, dans cet ordre).
  - getUserMedia avec 3 niveaux de contraintes (caméra arrière
    HD → caméra arrière simple → n'importe quelle caméra) pour
    maximiser la compatibilité iOS.
  - Tags vidéo : playsinline + webkit-playsinline + muted +
    autoplay (OBLIGATOIRE pour Safari/Chrome iOS — sans ça,
    la vidéo refuse de jouer en inline).
  - Boucle de scan via requestAnimationFrame, throttlée à
    150ms pour ménager le CPU.
  - Logger UI persistant en bas de l'écran : impossible
    d'ouvrir DevTools sur iPhone facilement, donc tout est
    loggé visuellement (entrées ok/err/warn/info/dbg).

  Formats détectés :
  ──────────────────
  qr_code, ean_13, ean_8, code_128, code_39, code_93, codabar,
  upc_a, upc_e, itf, pdf417, data_matrix, aztec.
  Fallback automatique sur qr_code seul si l'instanciation
  full-formats échoue.

  Contraintes importantes :
  ─────────────────────────
  - HTTPS obligatoire (sauf localhost) pour getUserMedia.
  - Ne PAS toucher aux attributs vidéo (playsinline etc.) ni
    aux 3 tentatives getUserMedia sans bien mesurer l'impact
    sur iOS — c'est la partie la plus fragile.
  - Le throttle à 150ms est volontaire, ne pas baisser.

  Base de données :
  ─────────────────
  - Fichier CSV (produits.csv par défaut) hébergé sur le même
    repo GitHub. 3 colonnes : Numéro ; Code-barres ; Nom.
    Séparateur point-virgule (Excel FR friendly), BOM UTF-8.
  - Lecture ET écriture via l'API GitHub (api.github.com).
    Pas besoin de backend — la PAT (Personal Access Token)
    de l'utilisateur est stockée en localStorage côté iPhone.
  - Bouton ⚙ en haut à droite : owner / repo / branch / path
    / token. La config est persistée localement.
  - Flow scan :
      • Match → affiche "#N° — Nom"
      • No match → modale custom demande le nom →
        PUT GitHub avec next numéro auto-incrémenté →
        commit message "Ajout produit #N : Nom"
  - SHA du fichier toujours retenu pour les writes (GitHub
    refuse un PUT sans le SHA courant — protection conflit).
  - En cas d'échec write : rollback du Map en mémoire.

  Sécurité du token :
  ──────────────────
  - Fine-grained PAT, scope "Contents: Read & Write" sur LE
    SEUL repo concerné. Aucun autre droit.
  - Le token n'est jamais commité, jamais loggé, juste stocké
    dans localStorage de l'iPhone (effacé si "Effacer
    données du site" dans Safari/Chrome iOS).
  ═══════════════════════════════════════════════════════════════
-->
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#000000">
  <title>Scanner</title>
  <style>
    /* ═══════════════════════════════════════════════
       Design system — Apple Dark
       ═══════════════════════════════════════════════ */
    :root {
      --bg:            #000000;
      --surface:       #1c1c1e;        /* systemGray6 dark */
      --surface-2:     #2c2c2e;        /* elevated */
      --surface-3:     #3a3a3c;        /* pressed */
      --separator:     rgba(84, 84, 88, 0.45);

      --label-1:       rgba(235, 235, 245, 0.96);
      --label-2:       rgba(235, 235, 245, 0.60);
      --label-3:       rgba(235, 235, 245, 0.30);
      --label-4:       rgba(235, 235, 245, 0.16);

      --blue:          #0a84ff;
      --green:         #30d158;
      --red:           #ff453a;
      --orange:        #ff9f0a;
      --yellow:        #ffd60a;

      --radius-card:   18px;
      --radius-btn:    14px;
      --radius-sm:     10px;
      --radius-sheet:  20px;

      --ease:          cubic-bezier(0.32, 0.72, 0, 1);

      --font-sys: -apple-system, BlinkMacSystemFont, "SF Pro Display",
                  "SF Pro Text", "Helvetica Neue", system-ui, sans-serif;
      --font-mono: ui-monospace, "SF Mono", "Menlo", "Consolas", monospace;

      --safe-top:    env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    html, body { overscroll-behavior: none; }

    body {
      background:
        radial-gradient(ellipse 120% 60% at 50% -10%, rgba(48, 209, 88, 0.10) 0%, transparent 55%),
        radial-gradient(ellipse 100% 50% at 50% 110%, rgba(10, 132, 255, 0.07) 0%, transparent 60%),
        var(--bg);
      background-attachment: fixed;
      color: var(--label-1);
      font-family: var(--font-sys);
      font-size: 17px;
      line-height: 1.4;
      min-height: 100dvh;
      padding:
        calc(var(--safe-top) + 12px)
        20px
        calc(var(--safe-bottom) + 24px);
      -webkit-font-smoothing: antialiased;
      -webkit-text-size-adjust: 100%;
    }

    .app {
      max-width: 440px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* ─── Header ─── */
    .app-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      padding: 8px 4px 4px;
    }
    .app-title {
      font-size: 34px;
      font-weight: 700;
      letter-spacing: -0.025em;
      background: linear-gradient(180deg, #ffffff 0%, #b8b8bc 130%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      color: transparent;
    }
    .app-version {
      font-size: 11px;
      font-weight: 600;
      color: var(--green);
      font-variant-numeric: tabular-nums;
      padding: 4px 8px;
      background: rgba(48, 209, 88, 0.12);
      border-radius: 20px;
      letter-spacing: 0.02em;
    }

    /* ─── Bouton config (icône flottante) ─── */
    #cfg-btn {
      position: fixed;
      top: calc(var(--safe-top) + 16px);
      right: 16px;
      width: 38px;
      height: 38px;
      background:
        linear-gradient(180deg, rgba(70, 70, 74, 0.55) 0%, rgba(28, 28, 30, 0.55) 100%);
      -webkit-backdrop-filter: blur(24px) saturate(180%);
      backdrop-filter: blur(24px) saturate(180%);
      border: 0.5px solid rgba(255, 255, 255, 0.12);
      border-radius: 50%;
      color: var(--label-1);
      font-size: 17px;
      cursor: pointer;
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow:
        0 1px 0 rgba(255, 255, 255, 0.08) inset,
        0 0 0 0.5px rgba(0, 0, 0, 0.3),
        0 8px 20px -8px rgba(0, 0, 0, 0.6);
      transition: transform 200ms var(--ease), box-shadow 200ms var(--ease);
    }
    #cfg-btn:active {
      transform: scale(0.92);
      box-shadow:
        0 1px 0 rgba(255, 255, 255, 0.04) inset,
        0 0 0 0.5px rgba(0, 0, 0, 0.3),
        0 2px 8px -2px rgba(0, 0, 0, 0.6);
    }

    /* ─── Carte scanner ─── */
    .scanner-card {
      border-radius: var(--radius-card);
      overflow: hidden;
      background: linear-gradient(180deg, #232325 0%, #161618 100%);
      aspect-ratio: 4 / 3;
      position: relative;
      box-shadow:
        0 1px 0 rgba(255, 255, 255, 0.08) inset,
        0 0 0 0.5px rgba(255, 255, 255, 0.06),
        0 30px 60px -25px rgba(48, 209, 88, 0.18),
        0 20px 40px -20px rgba(0, 0, 0, 0.7);
    }
    #scanner-container {
      width: 100%;
      height: 100%;
      position: relative;
    }
    #scanner-container video {
      width: 100% !important;
      height: 100% !important;
      object-fit: cover;
      display: block;
    }
    #scan-guide {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 78%;
      height: 44%;
      border-radius: 12px;
      box-shadow:
        0 0 0 2000px rgba(0, 0, 0, 0.5),
        inset 0 0 0 1.5px rgba(255, 255, 255, 0.9);
      pointer-events: none;
      z-index: 2;
    }
    /* coins type viseur */
    #scan-guide::before,
    #scan-guide::after {
      content: "";
      position: absolute;
      width: 26px;
      height: 26px;
      border: 3px solid var(--green);
      border-radius: 4px;
      filter: drop-shadow(0 0 6px rgba(48, 209, 88, 0.65)) drop-shadow(0 0 14px rgba(48, 209, 88, 0.35));
    }
    #scan-guide::before { top: -2px; left: -2px; border-right: none; border-bottom: none; border-top-left-radius: 12px; }
    #scan-guide::after  { bottom: -2px; right: -2px; border-left: none; border-top: none; border-bottom-right-radius: 12px; }

    /* ─── Bouton principal ─── */
    #btn {
      width: 100%;
      padding: 17px;
      background: linear-gradient(180deg, #3ce070 0%, #1fa848 100%);
      color: white;
      border: none;
      border-radius: var(--radius-btn);
      font-family: var(--font-sys);
      font-size: 17px;
      font-weight: 600;
      letter-spacing: -0.01em;
      cursor: pointer;
      text-shadow: 0 1px 1px rgba(0, 0, 0, 0.18);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.25),
        inset 0 -1px 0 rgba(0, 0, 0, 0.15),
        0 1px 0 rgba(0, 0, 0, 0.2),
        0 10px 28px -10px rgba(48, 209, 88, 0.55),
        0 4px 14px -4px rgba(0, 0, 0, 0.45);
      transition: transform 150ms var(--ease), box-shadow 200ms var(--ease), filter 200ms var(--ease);
    }
    #btn:active:not(:disabled) {
      transform: scale(0.97);
      filter: brightness(0.92);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.15),
        0 1px 0 rgba(0, 0, 0, 0.2),
        0 4px 12px -4px rgba(48, 209, 88, 0.4);
    }
    #btn:disabled {
      background: linear-gradient(180deg, #2c2c2e 0%, #1c1c1e 100%);
      color: var(--label-3);
      text-shadow: none;
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.04),
        0 0 0 0.5px rgba(255, 255, 255, 0.04);
      cursor: not-allowed;
    }
    #btn.stop {
      background: linear-gradient(180deg, #ff6b5f 0%, #d8362c 100%);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.22),
        inset 0 -1px 0 rgba(0, 0, 0, 0.15),
        0 1px 0 rgba(0, 0, 0, 0.2),
        0 10px 28px -10px rgba(255, 69, 58, 0.55),
        0 4px 14px -4px rgba(0, 0, 0, 0.45);
    }
    #btn.stop:active {
      filter: brightness(0.92);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.15),
        0 4px 12px -4px rgba(255, 69, 58, 0.4);
    }

    /* ─── Cartes (résultat + logs) ─── */
    .card {
      background: linear-gradient(180deg, #242427 0%, #1a1a1c 100%);
      border-radius: var(--radius-card);
      padding: 16px;
      box-shadow:
        0 1px 0 rgba(255, 255, 255, 0.06) inset,
        0 0 0 0.5px rgba(255, 255, 255, 0.04),
        0 12px 28px -16px rgba(0, 0, 0, 0.6);
    }

    .card-label {
      font-size: 13px;
      font-weight: 500;
      color: var(--label-2);
      margin-bottom: 8px;
      letter-spacing: -0.01em;
    }

    #code-display {
      font-family: var(--font-mono);
      font-size: 22px;
      font-weight: 600;
      letter-spacing: -0.01em;
      background: linear-gradient(180deg, #ffffff 0%, #c8f0d4 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      color: transparent;
      word-break: break-all;
      min-height: 32px;
      line-height: 1.3;
      transition: filter 250ms var(--ease);
    }
    #code-display:not(.placeholder) {
      filter: drop-shadow(0 0 14px rgba(48, 209, 88, 0.25));
    }
    #code-display.placeholder {
      background: none;
      -webkit-text-fill-color: var(--label-3);
      color: var(--label-3);
      font-weight: 400;
    }

    /* ─── Logs ─── */
    .logs-card { padding: 0; overflow: hidden; }
    .logs-toggle {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px;
      background: transparent;
      border: none;
      color: var(--label-1);
      font-family: var(--font-sys);
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      letter-spacing: -0.01em;
    }
    .logs-toggle .chev {
      color: var(--label-3);
      font-size: 17px;
      transition: transform 250ms var(--ease);
    }
    .logs-toggle[aria-expanded="true"] .chev { transform: rotate(90deg); }

    #log {
      max-height: 0;
      overflow: hidden;
      transition: max-height 300ms var(--ease);
      font-family: var(--font-mono);
      font-size: 12px;
      line-height: 1.5;
      color: var(--label-2);
      word-break: break-word;
    }
    #log.open {
      max-height: 360px;
      overflow-y: auto;
      padding: 0 16px 14px;
      border-top: 0.5px solid var(--separator);
    }
    #log .entry {
      padding: 6px 0;
      border-bottom: 0.5px solid rgba(84, 84, 88, 0.2);
    }
    #log .entry:last-child { border-bottom: none; }
    #log .entry.ok   { color: var(--green); }
    #log .entry.err  { color: var(--red); }
    #log .entry.warn { color: var(--orange); }
    #log .entry.info { color: var(--label-2); }
    #log .entry.dbg  { color: var(--label-3); }

    /* ─── Status ligne ─── */
    #status {
      font-size: 13px;
      font-weight: 500;
      color: var(--label-2);
      text-align: center;
      letter-spacing: -0.01em;
      min-height: 18px;
    }

    /* ═══════════════════════════════════════════════
       Modales — style iOS sheet
       ═══════════════════════════════════════════════ */
    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.5);
      -webkit-backdrop-filter: blur(8px);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: flex-end;
      justify-content: center;
      z-index: 100;
      animation: modalFadeIn 250ms var(--ease);
    }
    .modal[hidden] { display: none; }

    @keyframes modalFadeIn {
      from { background: rgba(0, 0, 0, 0); -webkit-backdrop-filter: blur(0); backdrop-filter: blur(0); }
    }

    .modal-panel {
      background: linear-gradient(180deg, #2a2a2d 0%, #1a1a1c 100%);
      border-radius: var(--radius-sheet) var(--radius-sheet) 0 0;
      padding: 24px 20px calc(var(--safe-bottom) + 24px);
      width: 100%;
      max-width: 480px;
      animation: sheetSlideUp 350ms var(--ease);
      position: relative;
      box-shadow:
        0 1px 0 rgba(255, 255, 255, 0.08) inset,
        0 -20px 60px -20px rgba(48, 209, 88, 0.12),
        0 -10px 40px -10px rgba(0, 0, 0, 0.5);
    }
    @media (min-width: 520px) {
      .modal { align-items: center; }
      .modal-panel {
        border-radius: var(--radius-sheet);
        max-width: 420px;
        margin: 20px;
        padding-bottom: 24px;
      }
    }

    @keyframes sheetSlideUp {
      from { transform: translateY(100%); }
      to   { transform: translateY(0); }
    }

    /* grabber visuel (iOS) */
    .modal-panel::before {
      content: "";
      position: absolute;
      top: 8px;
      left: 50%;
      transform: translateX(-50%);
      width: 36px;
      height: 5px;
      background: var(--label-4);
      border-radius: 3px;
    }
    @media (min-width: 520px) {
      .modal-panel::before { display: none; }
    }

    .modal-panel h2 {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--label-1);
      margin-bottom: 20px;
      margin-top: 8px;
    }

    .modal-panel label {
      display: block;
      margin-bottom: 14px;
      font-size: 13px;
      font-weight: 500;
      color: var(--label-2);
      letter-spacing: -0.01em;
    }

    .modal-panel input {
      display: block;
      width: 100%;
      padding: 13px 14px;
      margin-top: 6px;
      background: var(--surface-2);
      border: 0.5px solid transparent;
      border-radius: var(--radius-sm);
      color: var(--label-1);
      font-family: var(--font-sys);
      font-size: 16px;
      transition: background 150ms var(--ease), border-color 150ms var(--ease);
    }
    .modal-panel input:focus {
      outline: none;
      background: var(--surface-3);
      border-color: var(--blue);
      box-shadow: 0 0 0 4px rgba(10, 132, 255, 0.18);
    }
    .modal-panel input::placeholder { color: var(--label-3); }

    .modal-help {
      font-size: 13px;
      line-height: 1.45;
      color: var(--label-2);
      margin-bottom: 20px;
      padding: 12px 14px;
      background: var(--surface-2);
      border-radius: var(--radius-sm);
    }

    .modal-actions {
      display: flex;
      gap: 10px;
      margin-top: 8px;
    }
    .modal-actions button {
      flex: 1;
      padding: 14px;
      border: none;
      border-radius: var(--radius-btn);
      font-family: var(--font-sys);
      font-size: 17px;
      font-weight: 600;
      letter-spacing: -0.01em;
      cursor: pointer;
      transition: transform 150ms var(--ease), background 200ms var(--ease);
    }
    .modal-actions button:active { transform: scale(0.97); }
    .btn-cancel {
      background: linear-gradient(180deg, #3a3a3c 0%, #2c2c2e 100%);
      color: var(--label-1);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.06),
        0 1px 0 rgba(0, 0, 0, 0.2);
    }
    .btn-cancel:active { filter: brightness(0.9); }
    .btn-save {
      background: linear-gradient(180deg, #3ce070 0%, #1fa848 100%);
      color: white;
      text-shadow: 0 1px 1px rgba(0, 0, 0, 0.18);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.22),
        0 1px 0 rgba(0, 0, 0, 0.2),
        0 8px 20px -8px rgba(48, 209, 88, 0.5);
    }
    .btn-save:active { filter: brightness(0.92); }

    .new-code {
      font-family: var(--font-mono);
      font-size: 17px;
      font-weight: 500;
      color: var(--green);
      background: var(--surface-2);
      padding: 14px 16px;
      border-radius: var(--radius-sm);
      margin-bottom: 18px;
      word-break: break-all;
    }

    /* ─── Réduction d'animation (a11y) ─── */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>

  <button id="cfg-btn" aria-label="Configuration">⚙</button>

  <!-- Modale Configuration GitHub -->
  <div id="cfg-modal" class="modal" hidden>
    <div class="modal-panel">
      <h2>Configuration</h2>
      <label>Owner<input type="text" id="cfg-owner" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="ton-pseudo-github"></label>
      <label>Repo<input type="text" id="cfg-repo" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="nom-du-repo"></label>
      <label>Branch<input type="text" id="cfg-branch" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="main"></label>
      <label>Chemin du CSV<input type="text" id="cfg-path" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="produits.csv"></label>
      <label>Token (PAT)<input type="password" id="cfg-token" autocomplete="off" placeholder="github_pat_..."></label>
      <p class="modal-help">Token GitHub fine-grained avec permission « Contents : Read & Write » sur ce repo uniquement. Stocké uniquement sur ton appareil.</p>
      <div class="modal-actions">
        <button id="cfg-cancel" class="btn-cancel">Annuler</button>
        <button id="cfg-save" class="btn-save">Enregistrer</button>
      </div>
    </div>
  </div>

  <!-- Modale Nouveau produit -->
  <div id="new-modal" class="modal" hidden>
    <div class="modal-panel">
      <h2>Nouveau produit</h2>
      <div class="new-code" id="new-code-val"></div>
      <label>Nom du produit<input type="text" id="new-name" autocomplete="off" placeholder="Ex : Nutella 750g"></label>
      <div class="modal-actions">
        <button id="new-cancel" class="btn-cancel">Annuler</button>
        <button id="new-save" class="btn-save">Enregistrer</button>
      </div>
    </div>
  </div>

  <main class="app">

    <header class="app-header">
      <h1 class="app-title">Scanner</h1>
      <span class="app-version">V12</span>
    </header>

    <section class="scanner-card">
      <div id="scanner-container">
        <div id="scan-guide"></div>
      </div>
    </section>

    <button id="btn" disabled>Chargement…</button>

    <div id="status">Initialisation…</div>

    <section class="card" id="result-box">
      <p class="card-label">Code détecté</p>
      <div id="code-display" class="placeholder">—</div>
    </section>

    <section class="card logs-card" id="note-box">
      <button class="logs-toggle" id="logs-toggle" aria-expanded="false" aria-controls="log">
        <span>Logs</span>
        <span class="chev">›</span>
      </button>
      <div id="log"></div>
    </section>

  </main>

  <script>
    var logEl = document.getElementById('log');
    function uiLog(msg, type) {
      type = type || 'info';
      try {
        var line = document.createElement('div');
        line.className = 'entry ' + type;
        line.textContent = new Date().toLocaleTimeString() + ' — ' + msg;
        logEl.prepend(line);
      } catch (e) {}
      try { console.log('[' + type + ']', msg); } catch (e) {}
    }
    window.uiLog = uiLog;

    window.addEventListener('error', function (ev) {
      uiLog('JS ERROR: ' + (ev.message || ev.error) +
        (ev.filename ? ' @ ' + ev.filename + ':' + ev.lineno : ''), 'err');
    });
    window.addEventListener('unhandledrejection', function (ev) {
      var r = ev.reason;
      uiLog('UNHANDLED PROMISE: ' + ((r && (r.message || r.toString())) || 'unknown'), 'err');
    });

    uiLog('Logger prêt', 'ok');

    (function diag() {
      try {
        uiLog('UA: ' + navigator.userAgent, 'dbg');
        uiLog('isSecureContext: ' + window.isSecureContext, window.isSecureContext ? 'ok' : 'err');
        uiLog('Protocole: ' + location.protocol, (location.protocol === 'https:' || location.hostname === 'localhost') ? 'ok' : 'err');
        uiLog('mediaDevices: ' + !!(navigator.mediaDevices), navigator.mediaDevices ? 'ok' : 'err');
        uiLog('WebAssembly: ' + (typeof WebAssembly !== 'undefined'), typeof WebAssembly !== 'undefined' ? 'ok' : 'err');
        uiLog('BarcodeDetector natif: ' + ('BarcodeDetector' in window), ('BarcodeDetector' in window) ? 'ok' : 'warn');

        if (location.protocol !== 'https:' && location.hostname !== 'localhost' && location.hostname !== '127.0.0.1') {
          uiLog('⚠ La caméra exige HTTPS (sauf localhost). Sur GitHub Pages ça marchera.', 'warn');
        }

        var isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
                    (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
        uiLog('iOS détecté: ' + isIOS, 'dbg');
      } catch (e) {
        uiLog('Diag err: ' + e.message, 'err');
      }
    })();

    // ═══════════════════════════════════════════════════════════════
    // BASE DE DONNÉES — CSV hébergé sur GitHub
    // ═══════════════════════════════════════════════════════════════
    var GH = {
      owner:  localStorage.getItem('gh_owner')  || '',
      repo:   localStorage.getItem('gh_repo')   || '',
      branch: localStorage.getItem('gh_branch') || 'main',
      path:   localStorage.getItem('gh_path')   || 'produits.csv',
      token:  localStorage.getItem('gh_token')  || ''
    };
    function saveGHConfig() {
      localStorage.setItem('gh_owner',  GH.owner);
      localStorage.setItem('gh_repo',   GH.repo);
      localStorage.setItem('gh_branch', GH.branch);
      localStorage.setItem('gh_path',   GH.path);
      localStorage.setItem('gh_token',  GH.token);
    }

    var productsMap = new Map();   // barcode → { numero, nom }
    var nextNumero = 1;
    var fileSha = null;            // SHA GitHub du CSV (requis pour les writes)

    // base64 ⇄ UTF-8 (l'API GitHub renvoie/attend du base64)
    function b64encUtf8(str) { return btoa(unescape(encodeURIComponent(str))); }
    function b64decUtf8(b64) { return decodeURIComponent(escape(atob(b64.replace(/\n/g, '')))); }

    function parseCSV(text) {
      productsMap.clear();
      nextNumero = 1;
      if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1);  // strip BOM
      var lines = text.split(/\r?\n/);
      for (var i = 1; i < lines.length; i++) {     // skip header
        var line = lines[i].trim();
        if (!line) continue;
        var parts = line.split(';');
        var num = parseInt(parts[0], 10);
        var barcode = (parts[1] || '').trim();
        var name = parts.slice(2).join(';').trim();
        if (name.charAt(0) === '"' && name.charAt(name.length - 1) === '"') {
          name = name.slice(1, -1).replace(/""/g, '"');
        }
        if (!barcode || isNaN(num)) continue;
        productsMap.set(barcode, { numero: num, nom: name });
        if (num >= nextNumero) nextNumero = num + 1;
      }
    }

    function serializeCSV() {
      var lines = ['Numéro;Code-barres;Nom du produit'];
      var entries = Array.from(productsMap.entries());
      entries.sort(function (a, b) { return a[1].numero - b[1].numero; });
      for (var i = 0; i < entries.length; i++) {
        var bc = entries[i][0];
        var info = entries[i][1];
        var name = info.nom;
        if (/[;"\n\r]/.test(name)) name = '"' + name.replace(/"/g, '""') + '"';
        lines.push(info.numero + ';' + bc + ';' + name);
      }
      return '﻿' + lines.join('\n') + '\n';
    }

    function decodeFetchError(e, msg) {
      if (e && (e.name === 'TypeError') || msg === 'Load failed' || msg === 'Failed to fetch' || msg === 'NetworkError when attempting to fetch resource.') {
        return ' [RÉSEAU : pas d\'internet, ou api.github.com bloqué (content blocker iOS, VPN, DNS), ou token avec caractère invisible/espace en trop]';
      }
      if (msg.indexOf('401') !== -1 || /credentials/i.test(msg)) return ' [Token invalide / expiré / révoqué]';
      if (msg.indexOf('403') !== -1) return ' [Token sans permission Contents Read&Write sur ce repo]';
      if (msg.indexOf('404') !== -1) return ' [Owner/repo/branch/path incorrect, ou le repo est privé et le token n\'y a pas accès]';
      if (msg.indexOf('409') !== -1 || msg.indexOf('422') !== -1) return ' [Conflit SHA — recharge la page]';
      return '';
    }

    async function loadDatabase() {
      if (!GH.owner || !GH.repo || !GH.path) {
        uiLog('Config GitHub incomplète — clique sur ⚙', 'warn');
        return false;
      }
      var url = 'https://api.github.com/repos/' + GH.owner + '/' + GH.repo +
                '/contents/' + GH.path + '?ref=' + encodeURIComponent(GH.branch);
      uiLog('GET ' + GH.owner + '/' + GH.repo + '/' + GH.path + '@' + GH.branch, 'dbg');
      try {
        var headers = { 'Accept': 'application/vnd.github+json' };
        if (GH.token) headers['Authorization'] = 'Bearer ' + GH.token;
        var res = await fetch(url, { headers: headers, cache: 'no-store' });
        if (!res.ok) {
          var b = await res.json().catch(function () { return {}; });
          throw new Error('HTTP ' + res.status + ' — ' + (b.message || res.statusText));
        }
        var data = await res.json();
        fileSha = data.sha;
        var csv = b64decUtf8(data.content);
        parseCSV(csv);
        uiLog('DB OK : ' + productsMap.size + ' produit(s), prochain n° = ' + nextNumero + ', sha=' + fileSha.substr(0, 7), 'ok');
        return true;
      } catch (e) {
        var msg = e.message || String(e);
        uiLog('Erreur chargement DB : ' + msg + decodeFetchError(e, msg), 'err');
        return false;
      }
    }

    async function saveProduct(barcode, name) {
      if (!GH.token) { uiLog('Token GitHub manquant — clique sur ⚙', 'err'); return null; }
      if (!GH.owner || !GH.repo) { uiLog('Owner/repo manquants — clique sur ⚙', 'err'); return null; }
      if (fileSha === null) {
        uiLog('⚠ Pas de SHA en mémoire — la DB n\'a jamais été chargée. Re-vérifie la config et recharge la page.', 'err');
        return null;
      }
      var numero = nextNumero;
      productsMap.set(barcode, { numero: numero, nom: name });
      nextNumero++;
      var csv = serializeCSV();
      uiLog('PUT ' + GH.owner + '/' + GH.repo + '/' + GH.path + ' (sha=' + fileSha.substr(0,7) + ', size=' + csv.length + ')', 'dbg');
      try {
        var url = 'https://api.github.com/repos/' + GH.owner + '/' + GH.repo +
                  '/contents/' + GH.path;
        var body = {
          message: 'Ajout produit #' + numero + ' : ' + name,
          content: b64encUtf8(csv),
          branch: GH.branch,
          sha: fileSha
        };
        var res = await fetch(url, {
          method: 'PUT',
          headers: {
            'Accept': 'application/vnd.github+json',
            'Authorization': 'Bearer ' + GH.token,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(body)
        });
        if (!res.ok) {
          var errBody = await res.json().catch(function () { return {}; });
          throw new Error('HTTP ' + res.status + ' — ' + (errBody.message || res.statusText));
        }
        var data = await res.json();
        fileSha = data.content.sha;
        uiLog('Produit #' + numero + ' commit ✓ (nouveau sha=' + fileSha.substr(0,7) + ')', 'ok');
        return numero;
      } catch (e) {
        // rollback
        productsMap.delete(barcode);
        nextNumero--;
        var msg = e.message || String(e);
        uiLog('Erreur écriture : ' + msg + decodeFetchError(e, msg), 'err');
        return null;
      }
    }

    // ─── Modales (config + nouveau produit) ───
    function openConfig() {
      document.getElementById('cfg-owner').value  = GH.owner;
      document.getElementById('cfg-repo').value   = GH.repo;
      document.getElementById('cfg-branch').value = GH.branch;
      document.getElementById('cfg-path').value   = GH.path;
      document.getElementById('cfg-token').value  = GH.token;
      document.getElementById('cfg-modal').hidden = false;
    }
    document.getElementById('cfg-btn').addEventListener('click', openConfig);
    document.getElementById('cfg-cancel').addEventListener('click', function () {
      document.getElementById('cfg-modal').hidden = true;
    });
    // Nettoie les inputs : whitespace + caractères non-imprimables (NBSP, zero-width, etc.)
    function cleanInput(v) {
      return (v || '').trim().replace(/[^\x21-\x7eÀ-ſ]/g, '');
    }
    function cleanToken(v) {
      // Tokens GitHub : ASCII imprimable uniquement
      return (v || '').trim().replace(/[^\x21-\x7e]/g, '');
    }

    document.getElementById('cfg-save').addEventListener('click', function () {
      GH.owner  = cleanInput(document.getElementById('cfg-owner').value);
      GH.repo   = cleanInput(document.getElementById('cfg-repo').value);
      GH.branch = cleanInput(document.getElementById('cfg-branch').value) || 'main';
      GH.path   = cleanInput(document.getElementById('cfg-path').value)   || 'produits.csv';
      var rawToken = document.getElementById('cfg-token').value;
      GH.token  = cleanToken(rawToken);
      if (rawToken.length !== GH.token.length) {
        uiLog('⚠ Token contenait ' + (rawToken.length - GH.token.length) + ' caractère(s) invisible(s) — nettoyés', 'warn');
      }
      saveGHConfig();
      document.getElementById('cfg-modal').hidden = true;
      uiLog('Config OK : ' + GH.owner + '/' + GH.repo + ' @ ' + GH.branch + ' / ' + GH.path + ' (token ' + GH.token.length + ' chars)', 'ok');
      pingGitHub().then(function (ok) {
        if (ok) loadDatabase();
      });
    });

    // Test connectivité GitHub (séparé de loadDatabase pour diagnostiquer)
    async function pingGitHub() {
      try {
        uiLog('Ping api.github.com...', 'dbg');
        var res = await fetch('https://api.github.com/zen', { cache: 'no-store' });
        if (res.ok) {
          var txt = await res.text();
          uiLog('Ping GitHub OK : « ' + txt + ' »', 'ok');
          return true;
        }
        uiLog('Ping GitHub HTTP ' + res.status, 'err');
        return false;
      } catch (e) {
        var msg = e.message || String(e);
        uiLog('Ping GitHub ÉCHEC : ' + msg + ' → api.github.com est INACCESSIBLE depuis ce navigateur (content blocker, VPN, sandbox preview, ou réseau bloqué)', 'err');
        return false;
      }
    }

    function promptNewProduct(code, callback) {
      document.getElementById('new-code-val').textContent = code;
      var input = document.getElementById('new-name');
      input.value = '';
      document.getElementById('new-modal').hidden = false;
      setTimeout(function () { try { input.focus(); } catch (e) {} }, 80);

      var saveBtn = document.getElementById('new-save');
      var cancelBtn = document.getElementById('new-cancel');
      function cleanup() {
        document.getElementById('new-modal').hidden = true;
        saveBtn.removeEventListener('click', onSave);
        cancelBtn.removeEventListener('click', onCancel);
        input.removeEventListener('keydown', onKey);
      }
      function onSave() {
        var v = input.value.trim();
        cleanup();
        callback(v || null);
      }
      function onCancel() { cleanup(); callback(null); }
      function onKey(e) {
        if (e.key === 'Enter') onSave();
        else if (e.key === 'Escape') onCancel();
      }
      saveBtn.addEventListener('click', onSave);
      cancelBtn.addEventListener('click', onCancel);
      input.addEventListener('keydown', onKey);
    }

    // ═══════════════════════════════════════════════════════════════
    // SCANNER (logique d'origine, intouchée)
    // ═══════════════════════════════════════════════════════════════
    var scanning = false;
    var stream = null;
    var videoEl = null;
    var detector = null;
    var loopHandle = null;
    var lastScanTs = 0;
    var scanCount = 0;
    var BarcodeDetectorClass = null;

    async function loadDetector() {
      if ('BarcodeDetector' in window) {
        try {
          var formats = await window.BarcodeDetector.getSupportedFormats();
          uiLog('Natif dispo. Formats: ' + formats.join(', '), 'ok');
          BarcodeDetectorClass = window.BarcodeDetector;
          return true;
        } catch (e) {
          uiLog('Natif présent mais cassé: ' + e.message + ' — fallback polyfill', 'warn');
        }
      } else {
        uiLog('Pas de BarcodeDetector natif → chargement polyfill ZXing...', 'info');
      }

      var sources = [
        'https://esm.sh/barcode-detector@2/pure',
        'https://cdn.jsdelivr.net/npm/barcode-detector@2/dist/es/pure.min.js',
        'https://unpkg.com/barcode-detector@2/dist/es/pure.min.js'
      ];

      for (var i = 0; i < sources.length; i++) {
        var url = sources[i];
        try {
          uiLog('Polyfill tentative ' + (i + 1) + ': ' + url, 'info');
          var mod = await import(url);
          if (mod && mod.BarcodeDetector) {
            BarcodeDetectorClass = mod.BarcodeDetector;
            uiLog('Polyfill chargé ✓', 'ok');
            return true;
          } else {
            uiLog('Module reçu mais sans BarcodeDetector: ' + Object.keys(mod || {}).join(','), 'warn');
          }
        } catch (e) {
          uiLog('Échec ' + (i + 1) + ': ' + (e && e.message ? e.message : e), 'err');
        }
      }
      uiLog('Tous les CDN polyfill ont échoué', 'err');
      return false;
    }

    (async function init() {
      var btn = document.getElementById('btn');
      var status = document.getElementById('status');

      var ok = await loadDetector();
      if (!ok) {
        btn.textContent = 'Indisponible';
        status.textContent = 'Aucun détecteur utilisable';
        return;
      }

      try {
        detector = new BarcodeDetectorClass({
          formats: ['qr_code', 'ean_13', 'ean_8', 'code_128', 'code_39', 'code_93',
                    'codabar', 'upc_a', 'upc_e', 'itf', 'pdf417', 'data_matrix', 'aztec']
        });
        uiLog('Détecteur instancié ✓ (toutes formats)', 'ok');
      } catch (e) {
        uiLog('Instanciation full formats échoue: ' + e.message + ' — fallback QR seul', 'warn');
        try {
          detector = new BarcodeDetectorClass({ formats: ['qr_code'] });
          uiLog('Détecteur QR-only OK', 'warn');
        } catch (e2) {
          uiLog('Instanciation totalement échouée: ' + e2.message, 'err');
          btn.textContent = 'Indisponible';
          status.textContent = 'Impossible d initialiser le détecteur';
          return;
        }
      }

      btn.disabled = false;
      btn.textContent = 'Scanner';
      status.textContent = 'Touche Scanner pour commencer';

      // Chargement de la base de données (CSV sur GitHub)
      if (GH.owner && GH.repo) {
        loadDatabase();
      } else {
        uiLog('Pas de config GitHub — ouvre ⚙ pour la renseigner', 'warn');
      }
    })();

    document.getElementById('btn').addEventListener('click', function () {
      uiLog('Bouton cliqué (scanning=' + scanning + ')', 'dbg');
      if (!scanning) startScanner();
      else stopScanner();
    });

    // ─── Toggle logs (collapse / expand) ───
    (function () {
      var btn = document.getElementById('logs-toggle');
      var log = document.getElementById('log');
      btn.addEventListener('click', function () {
        var open = log.classList.toggle('open');
        btn.setAttribute('aria-expanded', open ? 'true' : 'false');
      });
    })();

    async function startScanner() {
      if (!detector) {
        uiLog('Détecteur non prêt — abandon', 'err');
        return;
      }

      scanning = true;
      scanCount = 0;
      setDisplay('—', true);
      var btn = document.getElementById('btn');
      btn.textContent = 'Arrêter';
      btn.classList.add('stop');
      document.getElementById('status').textContent = 'Demande caméra...';

      videoEl = document.createElement('video');
      videoEl.setAttribute('playsinline', 'true');
      videoEl.setAttribute('webkit-playsinline', 'true');
      videoEl.setAttribute('autoplay', 'true');
      videoEl.setAttribute('muted', 'true');
      videoEl.muted = true;
      videoEl.playsInline = true;
      document.getElementById('scanner-container').prepend(videoEl);
      uiLog('Élément <video> créé', 'dbg');

      var tries = [
        { video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false },
        { video: { facingMode: 'environment' }, audio: false },
        { video: true, audio: false }
      ];

      var got = false;
      for (var i = 0; i < tries.length && !got; i++) {
        try {
          uiLog('getUserMedia tentative ' + (i + 1) + ': ' + JSON.stringify(tries[i].video), 'info');
          stream = await navigator.mediaDevices.getUserMedia(tries[i]);
          got = true;
          uiLog('Stream obtenu ✓', 'ok');
        } catch (err) {
          uiLog('Échec tentative ' + (i + 1) + ': ' + err.name + ' — ' + err.message, 'err');
        }
      }

      if (!got) {
        uiLog('Aucune contrainte n a fonctionné', 'err');
        stopScanner();
        return;
      }

      try {
        videoEl.srcObject = stream;
        uiLog('srcObject assigné', 'dbg');

        await new Promise(function (resolve, reject) {
          var done = false;
          var to = setTimeout(function () {
            if (done) return;
            done = true;
            reject(new Error('timeout loadedmetadata (5s)'));
          }, 5000);
          videoEl.addEventListener('loadedmetadata', function () {
            if (done) return;
            done = true;
            clearTimeout(to);
            resolve();
          }, { once: true });
        });
        uiLog('loadedmetadata — ' + videoEl.videoWidth + 'x' + videoEl.videoHeight, 'ok');

        try {
          await videoEl.play();
          uiLog('video.play() OK', 'ok');
        } catch (pe) {
          uiLog('video.play() échec: ' + pe.name + ' — ' + pe.message, 'err');
        }

        var tracks = stream.getVideoTracks();
        if (tracks.length) {
          var s = tracks[0].getSettings ? tracks[0].getSettings() : {};
          uiLog('Track: ' + (s.width || '?') + 'x' + (s.height || '?') + ' facing=' + (s.facingMode || '?'), 'info');
        }
      } catch (err) {
        uiLog('Erreur vidéo: ' + err.name + ' — ' + err.message, 'err');
        stopScanner();
        return;
      }

      document.getElementById('status').textContent = 'Caméra active — recherche...';
      uiLog('Démarrage boucle de scan', 'ok');
      scanLoop();
    }

    async function scanLoop() {
      if (!scanning) return;

      if (!videoEl || videoEl.readyState < 2) {
        loopHandle = requestAnimationFrame(scanLoop);
        return;
      }

      var now = performance.now();
      if (now - lastScanTs < 150) {
        loopHandle = requestAnimationFrame(scanLoop);
        return;
      }
      lastScanTs = now;

      try {
        var codes = await detector.detect(videoEl);
        scanCount++;
        if (codes && codes.length > 0) {
          var c = codes[0];
          uiLog('Code trouvé: ' + c.rawValue + ' (' + c.format + ')', 'ok');
          onDetected(c.rawValue);
          return;
        }
      } catch (e) {
        uiLog('detect err: ' + (e && e.message ? e.message : e), 'err');
      }

      if (scanCount > 0 && scanCount % 30 === 0) {
        uiLog('Scans effectués: ' + scanCount, 'dbg');
      }

      loopHandle = requestAnimationFrame(scanLoop);
    }

    function setDisplay(text, isPlaceholder) {
      var d = document.getElementById('code-display');
      d.textContent = text;
      d.classList.toggle('placeholder', !!isPlaceholder);
    }

    function onDetected(code) {
      stopScanner();
      var status = document.getElementById('status');
      var hit = productsMap.get(code);
      if (hit) {
        setDisplay('#' + hit.numero + ' — ' + hit.nom, false);
        status.textContent = 'Produit existant ✓';
        uiLog('Match : #' + hit.numero + ' ' + hit.nom, 'ok');
        return;
      }
      uiLog('Code inconnu : ' + code, 'warn');
      setDisplay(code, false);
      status.textContent = 'Nouveau code — saisis le nom';
      promptNewProduct(code, function (name) {
        if (!name) {
          status.textContent = 'Enregistrement annulé';
          setDisplay(code + ' · non enregistré', false);
          return;
        }
        status.textContent = 'Enregistrement sur GitHub…';
        saveProduct(code, name).then(function (numero) {
          if (numero) {
            setDisplay('#' + numero + ' — ' + name, false);
            status.textContent = 'Nouveau produit enregistré ✓';
          } else {
            setDisplay(code, false);
            status.textContent = 'Échec enregistrement — voir logs';
          }
        });
      });
    }

    function stopScanner() {
      scanning = false;
      if (loopHandle) { cancelAnimationFrame(loopHandle); loopHandle = null; }
      if (stream) {
        stream.getTracks().forEach(function (t) {
          try { t.stop(); } catch (e) {}
        });
        stream = null;
      }
      if (videoEl) {
        try { videoEl.pause(); } catch (e) {}
        videoEl.srcObject = null;
        videoEl.remove();
        videoEl = null;
      }
      var btn = document.getElementById('btn');
      btn.textContent = 'Scanner';
      btn.classList.remove('stop');
      var status = document.getElementById('status');
      if (/Caméra|recherche|Demande/.test(status.textContent)) {
        status.textContent = 'Scan arrêté';
      }
      uiLog('Scanner arrêté', 'info');
    }
  </script>
</body>
</html>
