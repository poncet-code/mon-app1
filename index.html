<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <title>Scanner</title>
  <script src="https://unpkg.com/@zxing/library@0.20.0/umd/index.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0a0a0a;
      color: #fff;
      font-family: monospace;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px;
    }

    h1 {
      font-size: 18px;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: #aaa;
      margin-bottom: 32px;
    }

    #scanner-container {
      width: 100%;
      max-width: 360px;
      border-radius: 12px;
      overflow: hidden;
      position: relative;
      background: #111;
      aspect-ratio: 4/3;
    }

    #scanner-container video {
      width: 100% !important;
      height: 100% !important;
      object-fit: cover;
      display: block;
    }

    #scan-guide {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 80%;
      height: 40%;
      border: 2px solid #00ff88;
      border-radius: 8px;
      box-shadow: 0 0 0 2000px rgba(0,0,0,0.45);
      pointer-events: none;
    }

    #btn {
      margin-top: 24px;
      width: 100%;
      max-width: 360px;
      padding: 16px;
      background: #00ff88;
      color: #000;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-family: monospace;
      font-weight: bold;
      letter-spacing: 2px;
      cursor: pointer;
    }

    #btn.stop {
      background: #ff4444;
      color: #fff;
    }

    #result-box {
      margin-top: 32px;
      width: 100%;
      max-width: 360px;
    }

    #result-box label {
      font-size: 11px;
      letter-spacing: 3px;
      color: #555;
      text-transform: uppercase;
      display: block;
      margin-bottom: 8px;
    }

    #code-display {
      background: #111;
      border: 1px solid #222;
      border-radius: 10px;
      padding: 16px;
      font-size: 22px;
      letter-spacing: 3px;
      color: #00ff88;
      min-height: 56px;
      word-break: break-all;
    }

    #note-box {
      margin-top: 16px;
    }

    #note-box label {
      font-size: 11px;
      letter-spacing: 3px;
      color: #555;
      text-transform: uppercase;
      display: block;
      margin-bottom: 8px;
    }

    #log {
      width: 100%;
      background: #111;
      border: 1px solid #222;
      border-radius: 10px;
      padding: 14px;
      color: #aaa;
      font-size: 12px;
      font-family: monospace;
      min-height: 120px;
      max-height: 200px;
      overflow-y: auto;
      word-break: break-all;
    }

    #log .entry { border-bottom: 1px solid #1a1a1a; padding: 4px 0; }
    #log .entry.ok { color: #00ff88; }
    #log .entry.err { color: #ff4444; }
    #log .entry.info { color: #aaa; }

    #status {
      margin-top: 12px;
      font-size: 12px;
      color: #444;
      letter-spacing: 1px;
      text-align: center;
    }
  </style>
</head>
<body>

  <h1>Scanner</h1>

  <div id="scanner-container">
    <div id="scan-guide"></div>
  </div>

  <button id="btn" onclick="toggleScanner()">SCANNER</button>

  <div id="result-box">
    <label>Code détecté</label>
    <div id="code-display">—</div>
  </div>

  <div id="note-box">
    <label>Logs</label>
    <div id="log"></div>
  </div>

  <div id="status">Appuie sur Scanner pour commencer</div>

  <script>
    let scanning = false;
    let stream = null;
    let videoEl = null;
    let rafId = null;
    let zxingReader = null;

    const USE_NATIVE = 'BarcodeDetector' in window;
    let barcodeDetector = null;

    function log(msg, type = 'info') {
      const el = document.getElementById('log');
      const line = document.createElement('div');
      line.className = 'entry ' + type;
      line.textContent = new Date().toLocaleTimeString() + ' — ' + msg;
      el.prepend(line);
    }

    log('USE_NATIVE BarcodeDetector : ' + USE_NATIVE);
    log('User Agent : ' + navigator.userAgent.slice(0, 80));

    if (USE_NATIVE) {
      try {
        barcodeDetector = new BarcodeDetector({
          formats: ['ean_13', 'ean_8', 'code_128', 'upc_a', 'upc_e']
        });
        log('BarcodeDetector initialisé', 'ok');
      } catch(e) {
        log('BarcodeDetector init error : ' + e.message, 'err');
      }
    } else {
      log('Fallback ZXing activé');
    }

    function toggleScanner() {
      if (!scanning) startScanner();
      else stopScanner();
    }

    async function startScanner() {
      scanning = true;
      document.getElementById('code-display').textContent = '—';
      document.getElementById('btn').textContent = 'ARRÊTER';
      document.getElementById('btn').classList.add('stop');
      document.getElementById('status').textContent = 'Caméra active...';
      log('Démarrage scanner...');

      videoEl = document.createElement('video');
      videoEl.setAttribute('playsinline', '');
      videoEl.muted = true;
      document.getElementById('scanner-container').prepend(videoEl);

      if (USE_NATIVE) {
        try {
          log('Demande accès caméra...');
          stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } }
          });
          log('Caméra obtenue', 'ok');
          videoEl.srcObject = stream;
          await videoEl.play();
          log('Vidéo en lecture — ' + videoEl.videoWidth + 'x' + videoEl.videoHeight, 'ok');
        } catch (err) {
          log('Erreur caméra : ' + err.name + ' — ' + err.message, 'err');
          document.getElementById('status').textContent = 'Erreur caméra : ' + err.message;
          stopScanner();
          return;
        }
        rafLoop();
      } else {
        log('ZXing : decodeFromConstraints...');
        const hints = new Map([[ZXing.DecodeHintType.TRY_HARDER, true]]);
        zxingReader = new ZXing.BrowserMultiFormatReader(hints);
        try {
          await zxingReader.decodeFromConstraints(
            { video: { facingMode: 'environment' } },
            videoEl,
            (result, err) => {
              if (err && !(err instanceof ZXing.NotFoundException)) {
                log('ZXing err : ' + err.message, 'err');
              }
              if (result && scanning) onDetected(result.getText());
            }
          );
          log('ZXing actif', 'ok');
        } catch (err) {
          log('ZXing init error : ' + err.message, 'err');
          document.getElementById('status').textContent = 'Erreur : ' + err.message;
          stopScanner();
        }
      }
    }

    let frameCount = 0;
    function rafLoop() {
      if (!scanning) return;
      barcodeDetector.detect(videoEl)
        .then(codes => {
          if (!scanning) return;
          frameCount++;
          if (frameCount % 30 === 0) log('Frames analysées : ' + frameCount);
          if (codes.length > 0) {
            log('Code trouvé : ' + codes[0].rawValue + ' (' + codes[0].format + ')', 'ok');
            onDetected(codes[0].rawValue);
          } else {
            rafId = requestAnimationFrame(rafLoop);
          }
        })
        .catch(err => {
          log('detect() error : ' + err.message, 'err');
          if (scanning) rafId = requestAnimationFrame(rafLoop);
        });
    }

    function onDetected(code) {
      document.getElementById('code-display').textContent = code;
      document.getElementById('status').textContent = 'Code détecté ✓';
      stopScanner();
    }

    function stopScanner() {
      scanning = false;
      frameCount = 0;
      cancelAnimationFrame(rafId);
      if (zxingReader) { zxingReader.reset(); zxingReader = null; }
      if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
      if (videoEl) { videoEl.remove(); videoEl = null; }
      document.getElementById('btn').textContent = 'SCANNER';
      document.getElementById('btn').classList.remove('stop');
      const status = document.getElementById('status');
      if (status.textContent === 'Caméra active...') {
        status.textContent = 'Scan arrêté';
      }
      log('Scanner arrêté');
    }
  </script>
</body>
</html>
